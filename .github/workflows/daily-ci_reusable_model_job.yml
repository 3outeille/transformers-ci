name: model jobs (OTEL-instrumented)

# =============================================================================
# Reusable model-test job for the daily (scheduled) CI, ported from
# huggingface/transformers .github/workflows/model_jobs.yml.
#
# Difference vs the upstream model_jobs.yml: the pytest invocation is wrapped
# with `configure-ci-otel -- python3 -m pytest ...` so each test emits an OTEL
# span to the pytest-observability dashboards (same mechanism as PR CI). All
# `--make-reports` behaviour is preserved unchanged, so Slack reporting, new-
# failure detection and the daily-CI HF dataset upload keep working.
#
# The wrapper is a no-op when the runner does not inject OTEL_EXPORTER_OTLP_
# ENDPOINT: in that case the pytest command is byte-for-byte identical to the
# upstream one (see the OTEL_WRAP guard in "Run all tests on GPU").
# =============================================================================

on:
  workflow_call:
    inputs:
      folder_slices:
        required: true
        type: string
      machine_type:
        required: true
        type: string
      slice_id:
        required: true
        type: number
      docker:
        required: true
        type: string
      commit_sha:
        required: false
        type: string
      report_name_prefix:
        required: false
        default: run_models_gpu
        type: string
      runner_type:
        required: false
        type: string
      report_repo_id:
        required: false
        type: string
      pytest_marker:
        required: false
        type: string
      ci_event:
        required: false
        default: Daily CI
        type: string

env:
  HF_HOME: /mnt/cache
  TRANSFORMERS_IS_CI: yes
  OMP_NUM_THREADS: 8
  MKL_NUM_THREADS: 8
  RUN_SLOW: yes
  # For gated repositories, we still need to agree to share information on the Hub repo. page in order to get access.
  # This token is created under the bot `hf-transformers-bot`.
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  TF_FORCE_GPU_ALLOW_GROWTH: true
  CUDA_VISIBLE_DEVICES: 0,1
  NO_COLOR: 1
  # Cap the CPU RAM that psutil reports to pytest so device_map="auto" offloads some layers to disk
  # instead of packing everything into CPU RAM (K8S runners share a ~750 GB host, causing GPU OOM).
  # See huggingface/transformers#46539 for details.
  CI_CPU_MEMORY_LIMIT_GB: 60

permissions:
  contents: read

jobs:
  run_models_gpu:
    permissions:
      contents: read
    name: " "
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        folders: ${{ fromJson(inputs.folder_slices)[inputs.slice_id] }}
    runs-on:
      group: '${{ inputs.machine_type }}'
    container:
      image: ${{ inputs.docker }}
      options: --gpus all --shm-size "16gb" --ipc host -v /mnt/cache/.cache/huggingface:/mnt/cache/
    env:
      # OTEL observability (same knobs as the PR-CI reusable test job).
      # TRANSFORMERS_TEST_OTEL_SUITE groups all spans of this run under the job
      # family (e.g. run_models_gpu) on the dashboards. There is no PR for the
      # daily CI, so `pr` defaults to "none" and the run is identified by
      # GITHUB_RUN_ID on branch `main` (the "branch" dashboard variant).
      TRANSFORMERSCI_OTEL_DEBUG: "1"
      TRANSFORMERS_TEST_OTEL_SUITE: ${{ inputs.report_name_prefix }}
      # Distinguish scheduled daily runs from push-to-main merge runs on the
      # dashboards: both otherwise collapse to pr="main" (no PR number).
      # The "Run all tests on GPU" step slugifies this into
      # transformers.test.ci_event; configure-ci-otel folds it into the span
      # resource attributes and the trace-exporter promotes it to the `ci_event`
      # Prometheus label consumed by the daily dashboard. Every caller family
      # (daily, nightly, past, flash-attn, PR comment CI, push) therefore lands
      # on its own label value instead of all reporting as "daily".
      CI_EVENT: ${{ inputs.ci_event }}
    outputs:
      machine_type: ${{ steps.set_machine_type.outputs.machine_type }}
    steps:
      - name: Echo input and matrix info
        shell: bash
        env:
          folder_slices: ${{ inputs.folder_slices }}
          matrix_folders: ${{ matrix.folders }}
          slice_data: ${{ toJson(fromJson(inputs.folder_slices)[inputs.slice_id]) }}
        run: |
          echo "$folder_slices"
          echo "$matrix_folders"
          echo "$slice_data"

      - name: Echo folder ${{ matrix.folders }}
        shell: bash
        # For folders like `models/bert`, set an env. var. (`matrix_folders`) to `models_bert`, which will be used to
        # set the artifact folder names (because the character `/` is not allowed).
        env:
          matrix_folders_raw: ${{ matrix.folders }}
        run: |
          echo "$matrix_folders_raw"
          matrix_folders="${matrix_folders_raw/'models/'/'models_'}"
          echo "$matrix_folders"
          echo "matrix_folders=$matrix_folders" >> $GITHUB_ENV

      - name: Update clone
        working-directory: /transformers
        env:
          commit_sha: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin "$commit_sha" && git checkout "$commit_sha"

#      - name: Checkout specific commit
#        working-directory: /transformers
#        run: git checkout 536ecc007387a50e77603bb5d92100e9b07514cc

      - name: Reinstall transformers in edit mode (remove the one installed during docker image build)
        working-directory: /transformers
        run: python3 -m pip uninstall -y transformers && python3 -m pip install -e .

      - name: Install kernels from source
        working-directory: /transformers
        run: |
          echo "=== [DEBUG] Installing kernels from source ==="
          pip install git+https://github.com/huggingface/kernels#subdirectory=kernels && pip install -U urllib3
          echo "=== [DEBUG] kernels + urllib3 install done ==="
          pip show kernels urllib3 sigstore tuf | grep -E 'Name:|Version:'

      - name: Debug kernels import chain (hang detection)
        working-directory: /transformers
        run: |
          echo "=== [DEBUG] Testing kernels import chain with 60s timeout per step ==="
          python3 - <<'EOF'
          import sys
          import threading
          import warnings
          warnings.filterwarnings("ignore")

          def run_with_timeout(label, fn, timeout=60):
              result = {"done": False, "error": None}
              def target():
                  try:
                      fn()
                      result["done"] = True
                  except Exception as e:
                      result["error"] = e
                      result["done"] = True
              t = threading.Thread(target=target, daemon=True)
              t.start()
              t.join(timeout=timeout)
              if not result["done"]:
                  print(f"WARNING: [{label}] HUNG after {timeout}s - potential deadlock!", flush=True)
              elif result["error"]:
                  print(f"WARNING: [{label}] raised {type(result['error']).__name__}: {result['error']}", flush=True)
              else:
                  print(f"OK: [{label}] completed", flush=True)

          run_with_timeout("import kernels",          lambda: __import__("kernels"))
          run_with_timeout("import kernels.load",     lambda: __import__("kernels.load"))
          run_with_timeout("import kernels.validate", lambda: __import__("kernels.validate"))
          run_with_timeout("import kernels.verify",   lambda: __import__("kernels.verify"))
          run_with_timeout("import sigstore.models",  lambda: __import__("sigstore.models"))
          run_with_timeout("import tuf.ngclient",     lambda: __import__("tuf.ngclient"))
          run_with_timeout("import urllib3",          lambda: __import__("urllib3"))
          print("=== [DEBUG] import chain check complete ===", flush=True)
          EOF

      # OTEL observability wrapper intentionally skipped for this kernels debug run

      - name: Time Python imports (debug collection slowness)
        working-directory: /transformers
        run: |
          echo "=== [DEBUG] Timing: import transformers ==="
          time python3 -c "import transformers; print('transformers imported OK')"
          echo "=== [DEBUG] Timing: import test_modeling_llama ==="
          time python3 -c "import importlib.util, time as _t; t0=_t.time(); spec=importlib.util.spec_from_file_location('t','tests/models/llama/test_modeling_llama.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print(f'test_modeling_llama imported in {_t.time()-t0:.2f}s')"
          echo "=== [DEBUG] Timing: pytest collect-only on full llama dir ==="
          _cstart=$(date +%s)
          python3 -m pytest --collect-only -q tests/models/llama/ 2>&1 | tail -3
          _cend=$(date +%s)
          echo "=== [DEBUG] full-dir collect-only took $((_cend - _cstart))s ==="


      - name: Update / Install some packages (for Past CI)
        if: ${{ contains(inputs.docker, '-past-') }}
        working-directory: /transformers
        run: |
          python3 -m pip install -U datasets

      - name: Update / Install some packages (for Past CI)
        if: ${{ contains(inputs.docker, '-past-') && contains(inputs.docker, '-pytorch-') }}
        working-directory: /transformers
        run: |
          python3 -m pip install --no-cache-dir git+https://github.com/huggingface/accelerate@main#egg=accelerate

      - name: NVIDIA-SMI
        run: |
          nvidia-smi

      - name: CPU and memory info
        run: |
          echo "=== CPU info ==="
          nproc
          grep 'model name' /proc/cpuinfo | head -1
          echo "=== Memory info ==="
          free -h
          cat /proc/meminfo | grep -E 'MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree'
          echo "=== cgroup memory limit ==="
          cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || cat /sys/fs/cgroup/memory.max 2>/dev/null || echo "no cgroup memory limit found"
          echo "=== Disk space ==="
          df -h /mnt/cache 2>/dev/null || df -h /

      - name: Environment
        working-directory: /transformers
        run: |
          python3 utils/print_env.py

      - name: Show installed libraries and their versions
        working-directory: /transformers
        run: pip freeze

      - name: Set `machine_type` for report and artifact names
        id: set_machine_type
        working-directory: /transformers
        shell: bash
        env:
          input_machine_type: ${{ inputs.machine_type }}
        run: |
          echo "$input_machine_type"

          if [ "$input_machine_type" = "aws-g5-4xlarge-cache" ]; then
            machine_type=single-gpu
          elif [ "$input_machine_type" = "aws-g5-12xlarge-cache" ]; then
            machine_type=multi-gpu
          else
            machine_type="$input_machine_type"
          fi

          echo "$machine_type"
          echo "machine_type=$machine_type" >> $GITHUB_ENV
          echo "machine_type=$machine_type" >> $GITHUB_OUTPUT

      - name: Create report directory if it doesn't exist
        shell: bash
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
        run: |
          mkdir -p "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports"
          echo "dummy" > "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports/dummy.txt"
          ls -la "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports"

      - name: Run all tests on GPU
        working-directory: /transformers
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
          pytest_marker: ${{ inputs.pytest_marker }}
          model: ${{ matrix.folders }}
        run: |
          # [DEBUG] Limit to 4 specific tests for kernels investigation
          test_path="tests/models/llama/test_modeling_llama.py::LlamaModelTest::test_can_load_with_global_device_set tests/models/llama/test_modeling_llama.py::LlamaModelTest::test_causal_lm_can_accept_training_kwargs tests/models/llama/test_modeling_llama.py::LlamaIntegrationTest::test_flash_with_static_cache tests/models/llama/test_modeling_llama.py::LlamaIntegrationTest::test_llama_3_1_hard"

          # ── EFS cache for large models with Xet FUSE OOM issues ─────────────
          # TODO: temporary workaround until Xet FUSE prefetch OOM is fixed upstream.
          # Bucket cache runners mount model weights via Xet FUSE. For large
          # models (>20 GB), Xet prefetch can exhaust cgroup RAM → exit 137.
          # /mnt/efs_cache is an EFS (NFS) mount pre-warmed with these weights;
          # it avoids the Xet FUSE entirely. Has no effect on other runner types.
          EFS_MODELS="cohere2_vision deepseek_v32 exaone4 exaone4_5 gemma2 glm4_moe glm4v_moe llama4 minimax_m3_vl mistral4 muse_glimmer muse_glimmer_assistant phimoe qwen2_moe qwen3_omni_moe qwen3_vl_moe"
          model_short="${model#models/}"
          if printf '%s\n' $EFS_MODELS | grep -qx "$model_short" && [ -d "/mnt/efs_cache" ]; then
            export HF_HOME=/mnt/efs_cache
            echo "EFS cache selected for ${model_short}: HF_HOME=/mnt/efs_cache"
          fi

          echo "HF_HOME=${HF_HOME}"

          echo "=== [DEBUG] Memory before pytest ==="
          free -h

          echo "=== [DEBUG] collect-only already done in import timing step above ==="

          echo "=== [DEBUG] Starting pytest at $(date) ==="
          script -q -c "PATCH_TESTING_METHODS_TO_COLLECT_OUTPUTS=yes _PATCHED_TESTING_METHODS_OUTPUT_DIR=/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports python3 -m pytest -rsfE -v -m '${pytest_marker}' --make-reports=${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports ${test_path}" test_outputs.txt
          echo "=== [DEBUG] pytest exited at $(date) ==="
          ls -la
          # Extract the exit code from the output file
          EXIT_CODE=$(tail -1 test_outputs.txt | grep -o 'COMMAND_EXIT_CODE="[0-9]*"' | cut -d'"' -f2)
          exit ${EXIT_CODE:-1}

      - name: Failure short reports
        if: ${{ failure() }}
        # This step is only to show information on Github Actions log.
        # Always mark this step as successful, even if the report directory or the file `failures_short.txt` in it doesn't exist
        continue-on-error: true
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
        run: cat "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports/failures_short.txt"

      - name: Captured information
        if: ${{ failure() }}
        continue-on-error: true
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
        run: |
          cat "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports/captured_info.txt"

      - name: Copy test_outputs.txt
        if: ${{ always() }}
        continue-on-error: true
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
        run: |
          cp /transformers/test_outputs.txt "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports"

      - name: "Test suite reports artifacts: ${{ env.machine_type }}_${{ inputs.report_name_prefix }}_${{ env.matrix_folders }}_test_reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.machine_type }}_${{ inputs.report_name_prefix }}_${{ env.matrix_folders }}_test_reports
          path: /transformers/reports/${{ env.machine_type }}_${{ inputs.report_name_prefix }}_${{ env.matrix_folders }}_test_reports

  collated_reports:
    name: Collated Reports
    if: ${{ always() && inputs.runner_type != '' }}
    needs: run_models_gpu
    uses: huggingface/transformers/.github/workflows/collated-reports.yml@main
    with:
      job: run_models_gpu
      report_repo_id: ${{ inputs.report_repo_id }}
      gpu_name: ${{ inputs.runner_type }}
      machine_type: ${{ needs.run_models_gpu.outputs.machine_type }}
    secrets: inherit
